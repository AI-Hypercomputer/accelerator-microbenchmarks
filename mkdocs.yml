site_name: TPUMS (TPU Microbenchmark Suite)
site_description: Modular, high-fidelity JAX microbenchmarks and profiling framework for Cloud TPUs.
site_url: https://ai-hypercomputer.github.io/accelerator-microbenchmarks/
repo_url: https://github.com/AI-Hypercomputer/accelerator-microbenchmarks
repo_name: AI-Hypercomputer/accelerator-microbenchmarks
docs_dir: docs
exclude_docs: requirements.txt
strict: true
validation:
  anchors: warn

hooks:
  - mkdocs_hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - User Guide: index.md
  - Benchmark Reference: BENCHMARKS.md
  - Running on GKE: GKE.md
  - Automation Pipeline: AUTOMATION.md

markdown_extensions:
  - admonition
  - github-callouts
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
