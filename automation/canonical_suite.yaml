# Canonical benchmark configurations for TPUMS nightly automation on GKE TPU v7x.
# Collectives run at 4x4x4 (16 nodes, 64 chips) and 2x2x1 (1 node, 4 chips). Single-host microbenchmarks run at 2x2x1 (1 node, 4 chips).

suite_name: canonical_7x_default
description: Default nightly benchmark suite for TPU v7x clusters

configs:
  # 4x4x4 Multi-node Collectives (16 nodes, 64 chips)
  - configs/tpu7x/4x4x4/all_gather.yaml
  - configs/tpu7x/4x4x4/all_reduce.yaml
  - configs/tpu7x/4x4x4/all_to_all.yaml

  # 2x2x1 Single-node Collectives (1 node, 4 chips)
  - configs/tpu7x/2x2x1/all_gather.yaml
  - configs/tpu7x/2x2x1/all_reduce.yaml
  - configs/tpu7x/2x2x1/all_to_all.yaml

  # 2x2x1 Single-node Microbenchmarks (1 node, 4 chips)
  - configs/tpu7x/2x2x1/gemm.yaml
  - configs/tpu7x/2x2x1/hbm.yaml
  - configs/tpu7x/2x2x1/host_to_device.yaml
  - configs/tpu7x/2x2x1/device_to_host.yaml
  - configs/tpu7x/2x2x1/device_to_device.yaml
