# Note: On containers with glibc >= 2.35 (e.g., Ubuntu 22.04+), set
# `GLIBC_TUNABLES=glibc.pthread.rseq=0` in the process/container launch
# environment; glibc reads GLIBC_TUNABLES at process start, before Python
# initializes:
#   GLIBC_TUNABLES=glibc.pthread.rseq=0 tpums benchmark run-config \
#     configs/tpu7x/2x2x1/dcn_all_to_all.yaml
benchmark:
  name: dcn_all_to_all
  xprof_timing: false
  params:
    warmup_tries: 20
    num_runs: 100
    dtype: bfloat16
  sweep:
    matrix_dim: [32768, 65536, 131072, 262144, 524288]
