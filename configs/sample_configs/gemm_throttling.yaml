# Sample configuration for the GEMM thermal/power throttling benchmark.
#
# Chronological Execution Timeline (`SoakingRunExecutor`):
#   1. Warmup (`warmup_tries`): Executes `warmup_tries` (10) untraced warmup
#      iterations (windowed up to `samples_per_run`) to complete JIT
#      compilation.
#   2. Phase 1 - Pre-Soaking Window (`pre_soaking_window` at t = 0s):
#      Immediately after warmup, runs 1 traced window of `samples_per_run` (25)
#      iterations to capture the un-throttled device latency
#      (`xprof_pre_soaking_p50_ms`).
#   3. Phase 2 - Untraced Thermal Soak (`min_duration_s`): Runs continuous,
#      untraced windows of `samples_per_run` (25) iterations until elapsed Phase
#      2 time >= `min_duration_s` (120.0s) so the accelerator heats up to
#      thermal steady state without trace flush gaps (`num_runs` is not used in
#      soaking mode).
#   4. Phase 3 - Post-Soaking Window (`post_soaking_window` at t = end of soak):
#      Runs 1 traced window of `samples_per_run` (25) iterations immediately
#      after Phase 2 soak to capture post-soak device latency
#      (`xprof_post_soaking_p50_ms`, `xprof_slowdown_ratio`) and firmware
#      thermal telemetry. Wall-clock soaking metrics
#      (`wall_clock_pre_soaking_p50_ms`, `wall_clock_post_soaking_p50_ms`,
#      `wall_clock_slowdown_ratio`) are derived from `pre_soaking_window`
#      (`times_ms[0]`) and `post_soaking_window` (`times_ms[-1]`), aligned with
#      XProf.
benchmark:
  name: gemm_throttling
  xprof_timing: true
  xprof_device_timing_aggregation: local_slowest_device
  params:
    warmup_tries: 10
    min_duration_s: 120.0
    in_dtype: bfloat16
    out_dtype: bfloat16
    m: 16384
    k: 16384
    n: 16384
    samples_per_run: 25
